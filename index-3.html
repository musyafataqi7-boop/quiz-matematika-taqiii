<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuis Matematika</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4FF; --bg2:#D9ECFF; --card:#FFFFFF; --blue:#8EC5FC; --blue-d:#4A90D9;
  --ink:#1F3A5F; --muted:#5F7A9C; --line:#CFE5FA;
  --ok:#CFF1DE; --ok-d:#2E9E6B; --bad:#FADADA; --bad-d:#CC5555;
  --shadow:0 10px 30px rgba(74,144,217,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  line-height:1.5;overflow-x:hidden;
}
/* gelembung latar */
.bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bubbles span{position:absolute;bottom:-120px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(142,197,252,.35));
  animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px)}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:26px;animation:drop .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes drop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.logo{width:48px;height:48px;border-radius:16px;background:var(--blue);display:grid;place-items:center;
  font-size:26px;font-weight:800;color:#fff;box-shadow:var(--shadow);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-4deg)}}
header h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
header p{font-size:.9rem;color:var(--muted)}
.screen{display:none}
.screen.active{display:block;animation:pop .45s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
h2{font-size:1.25rem;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:20px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.topic{background:var(--card);border:2px solid transparent;border-radius:22px;padding:18px;text-align:left;
  font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,border-color .2s}
.topic:hover,.topic:focus-visible{transform:translateY(-5px) rotate(-.6deg);border-color:var(--blue);outline:none}
.topic:active{transform:scale(.97)}
.topic .sym{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.4rem;font-weight:800;
  background:var(--bg2);color:var(--blue-d);margin-bottom:12px;transition:transform .3s}
.topic:hover .sym{transform:rotate(12deg) scale(1.1)}
.topic b{display:block;font-size:1.08rem}
.topic small{color:var(--muted)}
.topic.mix{grid-column:1/-1;background:linear-gradient(110deg,#fff,#EAF4FF);display:flex;align-items:center;gap:14px}
.topic.mix .sym{margin:0;background:var(--blue);color:#fff}
.card{background:var(--card);border-radius:26px;padding:24px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem;box-shadow:0 4px 12px rgba(74,144,217,.12)}
.chip.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--blue),var(--blue-d));transition:width .6s cubic-bezier(.3,.9,.3,1)}
.qnum{color:var(--muted);font-weight:700;font-size:.9rem;margin-bottom:6px}
.q{font-size:1.5rem;font-weight:800;line-height:1.35;margin-bottom:20px;min-height:2.7em}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;font-size:1.05rem;text-align:left;padding:14px 16px;border-radius:16px;cursor:pointer;
  background:var(--bg);color:var(--ink);border:2px solid var(--line);display:flex;gap:12px;align-items:center;
  transition:transform .15s,background .2s,border-color .2s;animation:slide .4s both}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:.9rem;color:var(--blue-d)}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--blue);transform:translateX(5px);outline:none}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--ok-d);animation:pulse .5s}
.opt.bad{background:var(--bad);border-color:var(--bad-d);animation:shake .45s}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.fb{display:none;margin-top:16px;padding:14px 16px;border-radius:16px;font-weight:700;animation:pop .35s both}
.fb.show{display:block}
.fb.ok{background:var(--ok);color:#1d6b47}.fb.bad{background:var(--bad);color:#8f3636}
.fb span{display:block;font-weight:400;margin-top:2px}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:13px 22px;cursor:pointer;
  background:var(--blue-d);color:#fff;box-shadow:0 8px 18px rgba(74,144,217,.35);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn.ghost{background:#fff;color:var(--blue-d);box-shadow:none;border:2px solid var(--line)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hide{display:none!important}
.result{text-align:center}
.ring{position:relative;width:170px;height:170px;margin:6px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--blue-d);stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.4s cubic-bezier(.3,.9,.3,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem}
.msg{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.review{text-align:left;margin-top:20px}
.review h3{font-size:1rem;margin-bottom:8px}
.rv{background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:.95rem}
.rv em{font-style:normal;color:var(--ok-d);font-weight:800}
.conf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:.9rem;font-weight:700;padding:14px 12px;border-top:2px dashed var(--line);animation:pop .7s .3s both}
footer span{display:inline-block;transition:transform .25s}
footer:hover span{transform:scale(1.08)}
footer{display:flex;flex-direction:column;align-items:center;gap:12px}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 22px rgba(74,144,217,.3);animation:float 4s ease-in-out infinite;transition:transform .3s}
.avatar:hover{transform:scale(1.1) rotate(-3deg)}
.avatars{display:flex;gap:18px;justify-content:center}
.avatars .avatar:nth-child(2){animation-delay:-2s}
.gridbg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;background-image:linear-gradient(rgba(142,197,252,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(142,197,252,.25) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse at center,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse at center,#000 35%,transparent 100%)}
.mathbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.mathbg span{position:absolute;font-weight:800;color:rgba(74,144,217,.16);animation:drift ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(-12deg)}to{transform:translateY(-26px) rotate(14deg)}}
.formulas{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 20px}
.formulas span{background:rgba(255,255,255,.75);border:2px dashed var(--line);border-radius:999px;padding:5px 14px;font-weight:800;font-size:.9rem;color:var(--blue-d);animation:bob 3s ease-in-out infinite}
.formulas span:nth-child(2){animation-delay:-.8s}.formulas span:nth-child(3){animation-delay:-1.6s}.formulas span:nth-child(4){animation-delay:-2.3s}
@keyframes bob{50%{transform:translateY(-4px)}}
@media(max-width:480px){.q{font-size:1.25rem}.card{padding:18px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bubbles,.mathbg{display:none}}
</style>
</head>
<body>
<div class="gridbg" aria-hidden="true"></div>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>
<div class="mathbg" id="mathbg" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="logo">π</div>
    <div><h1>Kuis Matematika</h1><p>Latihan soal, langsung ada pembahasan</p></div>
  </header>

  <section id="home" class="screen active">
    <h2>Pilih materi</h2>
    <p class="sub">Setiap kuis berisi soal pilihan ganda. Jawab, lihat pembahasannya, lalu lanjut.</p>
    <div class="formulas" aria-hidden="true"><span>a² + b² = c²</span><span>π ≈ 3,14</span><span>(a + b)² = a² + 2ab + b²</span><span>√9 = 3</span></div>
    <div class="topics" id="topics"></div>
  </section>

  <section id="quiz" class="screen">
    <div class="top">
      <button class="btn ghost" id="back" style="padding:8px 14px">Kembali</button>
      <div style="display:flex;gap:8px">
        <span class="chip" id="streak">Beruntun: 0</span>
        <span class="chip" id="score">Skor: 0</span>
      </div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <div class="qnum" id="qnum"></div>
      <div class="q" id="q"></div>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
      <div class="actions"><button class="btn hide" id="next">Soal berikutnya</button></div>
    </div>
  </section>

  <section id="end" class="screen">
    <div class="card result">
      <div class="ring">
        <svg width="170" height="170" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="fg" cx="60" cy="60" r="54"/></svg>
        <b id="pct">0%</b>
      </div>
      <div class="msg" id="msg"></div>
      <p class="sub" id="detail"></p>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="again">Ulangi materi ini</button>
        <button class="btn ghost" id="menu">Pilih materi lain</button>
      </div>
      <div class="review" id="review"></div>
    </div>
  </section>

 {q:"FPB dari 24 dan 36 adalah …",o:["6","12","8","4"],a:1,e:"24 = 2³ × 3 dan 36 = 2² × 3². Faktor sama terkecil: 2² × 3 = 12."}
],
aljabar:[
 {q:"Jika 2x + 5 = 17, maka x = …",o:["5","6","7","11"],a:1,e:"2x = 17 − 5 = 12, maka x = 6."},
 {q:"Jika 3x − 7 = 14, maka x = …",o:["5","6","7","8"],a:2,e:"3x = 14 + 7 = 21, maka x = 7."},
 {q:"Sederhanakan: 3a + 2b + 5a − b",o:["8a + b","8a + 3b","8ab + b","2a + b"],a:0,e:"Gabungkan suku sejenis: 3a + 5a = 8a dan 2b − b = b."},
 {q:"(x + 3)(x + 2) = …",o:["x² + 5","x² + 6x + 5","x² + 5x + 6","x² + 6"],a:2,e:"x·x + 2x + 3x + 6 = x² + 5x + 6."},
 {q:"Jika x = 4, nilai 2x² − 3 adalah …",o:["13","29","61","5"],a:1,e:"2 × 16 − 3 = 32 − 3 = 29."},
 {q:"Jika 5x − 3 = 2x + 9, maka x = …",o:["2","3","4","6"],a:2,e:"5x − 2x = 9 + 3, jadi 3x = 12 dan x = 4."},
 {q:"Faktorkan: x² − 9",o:["(x − 3)²","(x + 9)(x − 1)","(x + 3)(x − 3)","(x − 9)(x + 1)"],a:2,e:"Selisih dua kuadrat: a² − b² = (a + b)(a − b)."},
 {q:"Jika x/3 + 2 = 6, maka x = …",o:["4","10","12","24"],a:2,e:"x/3 = 4, maka x = 12."}
],
persen:[
 {q:"25% dari 200 adalah …",o:["25","50","75","100"],a:1,e:"25% = 1/4, dan 1/4 × 200 = 50."},
 {q:"15 dari 60 sama dengan … persen",o:["15%","20%","25%","30%"],a:2,e:"15/60 = 1/4 = 25%."},
 {q:"Harga baju Rp80.000 diskon 20%. Harga akhirnya …",o:["Rp60.000","Rp64.000","Rp66.000","Rp72.000"],a:1,e:"Diskon = 20% × 80.000 = 16.000, jadi 80.000 − 16.000 = 64.000."},
 {q:"40% dari suatu bilangan adalah 30. Bilangan itu …",o:["12","50","75","120"],a:2,e:"Bilangan = 30 ÷ 0,4 = 75."},
 {q:"0,35 jika ditulis dalam persen adalah …",o:["3,5%","35%","350%","0,35%"],a:1,e:"Kalikan 100: 0,35 × 100 = 35%."},
 {q:"Tabungan Rp500.000 berbunga 10% per tahun. Setelah 1 tahun menjadi …",o:["Rp510.000","Rp550.000","Rp600.000","Rp505.000"],a:1,e:"Bunga = 10% × 500.000 = 50.000, total 550.000."},
 {q:"3/5 jika ditulis dalam persen adalah …",o:["35%","53%","60%","65%"],a:2,e:"3/5 = 60/100 = 60%."},
 {q:"Bilangan 50 naik 20%. Hasilnya …",o:["55","60","65","70"],a:1,e:"Kenaikan = 20% × 50 = 10, jadi 50 + 10 = 60."}
],
pangkat:[
 {q:"2⁵ = …",o:["10","16","25","32"],a:3,e:"2 × 2 × 2 × 2 × 2 = 32."},
 {q:"3² × 3³ = …",o:["3⁵","3⁶","9⁵","9⁶"],a:0,e:"Basis sama, pangkat dijumlahkan: 3²⁺³ = 3⁵ = 243."},
 {q:"5⁰ = …",o:["0","1","5","tidak terdefinisi"],a:1,e:"Bilangan tidak nol berpangkat 0 hasilnya 1."},
 {q:"(2³)² = …",o:["32","36","64","128"],a:2,e:"Pangkat dikalikan: 2³ˣ² = 2⁶ = 64."},
 {q:"10⁻² = …",o:["−100","0,01","0,1","−20"],a:1,e:"10⁻² = 1/10² = 1/100 = 0,01."},
 {q:"√144 = …",o:["11","12","14","72"],a:1,e:"12 × 12 = 144."},
 {q:"2⁶ ÷ 2⁴ = …",o:["2","4","8","2¹⁰"],a:1,e:"Basis sama, pangkat dikurangi: 2⁶⁻⁴ = 2² = 4."},
 {q:"∛27 = …",o:["3","6","9","13"],a:0,e:"3 × 3 × 3 = 27, jadi akar pangkat tiga dari 27 adalah 3."}
],
extra:[
 {q:"Dina membaca 12 halaman sehari. Berapa halaman setelah 15 hari?",o:["150","170","180","190"],a:2,e:"12 × 15 = 180 halaman."},
 {q:"Rata-rata dari 80, 90, dan 100 adalah …",o:["85","90","95","270"],a:1,e:"(80 + 90 + 100) ÷ 3 = 270 ÷ 3 = 90."},
 {q:"Luas persegi dengan sisi 9 cm adalah …",o:["18 cm²","36 cm²","81 cm²","729 cm²"],a:2,e:"Luas = sisi × sisi = 9 × 9 = 81 cm²."},
 {q:"Jika 2ˣ = 32, maka x = …",o:["4","5","6","16"],a:1,e:"2⁵ = 32, jadi x = 5."}
]
};
const TOPICS=[
 {id:"aritmatika",name:"Aritmatika",sym:"+ −",desc:"Hitung dasar, pecahan, KPK, FPB"},
 {id:"aljabar",name:"Aljabar",sym:"x",desc:"Persamaan, bentuk aljabar, faktor"},
 {id:"persen",name:"Persen",sym:"%",desc:"Diskon, bunga, perbandingan"},
 {id:"pangkat",name:"Pangkat",sym:"x²",desc:"Eksponen, akar, sifat pangkat"},
 {id:"campuran",name:"Campuran",sym:"∑",desc:"10 soal acak dari semua materi",mix:true}
];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let topic,qs,i,score,streak,wrong,locked;

// gelembung latar
for(let n=0;n<14;n++){const s=document.createElement('span'),z=18+Math.random()*60;
 s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;animation-duration:${14+Math.random()*16}s;animation-delay:${-Math.random()*20}s`;
 $('bubbles').appendChild(s)}

// ornamen simbol matematika
const SYM=['π','∑','√','+','−','×','÷','%','x²','∞','=','∫','θ','≠','½','Δ'];
for(let n=0;n<22;n++){const s=document.createElement('span');s.textContent=SYM[n%SYM.length];
 s.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*92}%;font-size:${26+Math.random()*44}px;animation-duration:${5+Math.random()*6}s;animation-delay:${-Math.random()*8}s`;
 $('mathbg').appendChild(s)}

// daftar materi
TOPICS.forEach(t=>{const b=document.createElement('button');b.className='topic'+(t.mix?' mix':'');
 b.innerHTML=`<div class="sym">${t.sym}</div><div><b>${t.name}</b><small>${t.desc}</small></div>`;
 b.onclick=()=>start(t.id);$('topics').appendChild(b)});

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}

function start(id){
 topic=id;
 const pool=id==='campuran'?shuffle(Object.values(BANK).flat()).slice(0,10):shuffle(BANK[id]);
 qs=pool.map(q=>{const c=q.o[q.a];const o=shuffle(q.o);return{q:q.q,o,a:o.indexOf(c),e:q.e}});
 i=0;score=0;streak=0;wrong=[];
 $('score').textContent='Skor: 0';$('streak').textContent='Beruntun: 0';
 show('quiz');render();
}

function render(){
 locked=false;const d=qs[i];
 $('qnum').textContent=`Soal ${i+1} dari ${qs.length}`;
 $('q').textContent=d.q;
 $('prog').style.width=(i/qs.length*100)+'%';
 $('fb').className='fb';$('next').classList.add('hide');
 $('opts').innerHTML='';
 d.o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';
  b.innerHTML=`<span class="k">${'ABCD'[k]}</span><span></span>`;b.lastChild.textContent=t;
  b.onclick=()=>pick(k);$('opts').appendChild(b)});
}

function bump(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}

function pick(k){
 if(locked)return;locked=true;
 const d=qs[i],btns=[...document.querySelectorAll('.opt')],ok=k===d.a;
 btns.forEach(b=>b.disabled=true);
 btns[d.a].classList.add('ok');
 const fb=$('fb');
 if(ok){score++;streak++;bump($('score'));if(streak>1)bump($('streak'));
  fb.className='fb show ok';fb.innerHTML=`Benar!<span>${d.e}</span>`}
 else{btns[k].classList.add('bad');streak=0;wrong.push(d);
  fb.className='fb show bad';fb.innerHTML=`Belum tepat.<span>${d.e}</span>`}
 $('score').textContent='Skor: '+score;$('streak').textContent='Beruntun: '+streak;
 $('prog').style.width=((i+1)/qs.length*100)+'%';
 $('next').textContent=i===qs.length-1?'Lihat hasil':'Soal berikutnya';
 $('next').classList.remove('hide');$('next').focus();
}

$('next').onclick=()=>{i++;i<qs.length?render():finish()};
$('back').onclick=()=>show('home');
$('menu').onclick=()=>show('home');
$('again').onclick=()=>start(topic);

function finish(){
 show('end');
 const p=Math.round(score/qs.length*100);
 $('fg').style.strokeDashoffset=339.3;
 setTimeout(()=>{$('fg').style.strokeDashoffset=339.3*(1-p/100);
  let n=0;const t=setInterval(()=>{n+=Math.max(1,Math.round(p/30));if(n>=p){n=p;clearInterval(t)}$('pct').textContent=n+'%'},40)},200);
 $('msg').textContent=p>=90?'Luar biasa!':p>=70?'Bagus sekali!':p>=50?'Lumayan, terus berlatih!':'Jangan menyerah, coba lagi!';
 $('detail').textContent=`Kamu menjawab ${score} dari ${qs.length} soal dengan benar.`;
 const r=$('review');r.innerHTML='';
 if(wrong.length){r.innerHTML='<h3>Soal yang perlu diulang</h3>';
  wrong.forEach(w=>{const d=document.createElement('div');d.className='rv';
   d.innerHTML='<b></b><br><em></em> <span></span>';
   d.querySelector('b').textContent=w.q;d.querySelector('em').textContent='Jawaban: '+w.o[w.a]+'.';d.querySelector('span').textContent=w.e;r.appendChild(d)})}
 if(p>=80)confetti();
}

function confetti(){
 const cols=['#8EC5FC','#4A90D9','#CFF1DE','#FFE8A3','#F9C6D4','#C9B8FF'];
 for(let n=0;n<45;n++){const c=document.createElement('div');c.className='conf';
  c.style.cssText=`left:${Math.random()*100}%;background:${cols[n%cols.length]};animation-duration:${2.5+Math.random()*2}s;animation-delay:${Math.random()*.8}s`;
  document.body.appendChild(c);setTimeout(()=>c.remove(),5500)}
}
</script>
</body>
</html>
